<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Abstract Luxury Curtain Wave & E Logo -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- Elegant Curtain Drapery Lines -->
    <path d="M 60,80 Q 120,40 180,80 T 300,80 T 320,80 L 320,300 C 320,320 300,340 280,340 L 60,340 C 40,340 20,320 20,300 L 20,120 Q 20,80 60,80 Z" fill="none" stroke="url(#accentGrad)" stroke-width="12" opacity="0.3" />
    
    <!-- Stylized 'E' Ribbon / Drapery emblem -->
    <path d="M 110,100 L 270,100 C 290,100 300,110 300,125 C 300,140 290,150 270,150 L 170,150 C 145,150 135,160 135,175 C 135,190 145,200 170,200 L 260,200 C 280,200 290,210 290,225 C 290,240 280,250 260,250 L 170,250 C 145,250 135,260 135,275 C 135,290 145,300 170,300 L 280,300 C 300,300 310,310 310,325 C 310,340 300,350 280,350 L 110,350 C 85,350 70,335 70,310 L 70,140 C 70,115 85,100 110,100 Z" fill="url(#goldGrad)" />

    <!-- Accent Gems / Tassels -->
    <circle cx="280" cy="125" r="10" fill="#ffffff" opacity="0.9" />
    <circle cx="260" cy="225" r="10" fill="#ffffff" opacity="0.9" />
    <circle cx="280" cy="325" r="10" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
